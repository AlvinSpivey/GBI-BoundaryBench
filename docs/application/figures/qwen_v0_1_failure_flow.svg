<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-4B BoundaryBench v0.1 failure flow</title>
  <desc id="desc">Across 768 canonical held-out executions, 369 outputs were safe parse rejects, 399 were safe schema rejects, zero were accepted, and all 768 were quarantined.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="780" fill="#FFFFFF"/>
  <text x="600" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">Qwen3-4B-Instruct-2507 on BoundaryBench v0.1</text>
  <text x="600" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">256 held-out tasks × 3 evidence modes = 768 frozen canonical executions</text>

  <g filter="url(#shadow)">
    <rect x="120" y="130" width="960" height="82" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="600" y="166" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#172033" text-anchor="middle">768 completed held-out executions</text>
    <text x="600" y="194" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">all retained in the evaluation denominator</text>
  </g>
  <line x1="600" y1="212" x2="600" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="150" y="250" width="410" height="92" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="355" y="288" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#172033" text-anchor="middle">369 safe_parse_reject</text>
    <text x="355" y="318" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#9A3412" text-anchor="middle">mutually exclusive runner outcome</text>
    <rect x="640" y="250" width="410" height="92" rx="18" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/>
    <text x="845" y="288" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#172033" text-anchor="middle">399 safe_schema_reject</text>
    <text x="845" y="318" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#991B1B" text-anchor="middle">mutually exclusive runner outcome</text>
  </g>
  <line x1="600" y1="342" x2="600" y2="380" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="210" y="380" width="340" height="78" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="380" y="414" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">0 accepted outputs</text>
    <text x="380" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">0 boundarybench.result.v1 records</text>
    <rect x="650" y="380" width="340" height="78" rx="18" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2"/>
    <text x="820" y="414" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">768 quarantined</text>
    <text x="820" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">deterministic fail-closed outcome</text>
  </g>
  <line x1="600" y1="458" x2="600" y2="490" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="501" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Coverage = 0.0   •   Invalid-output rate = 1.0   •   Selective risk = undefined at zero coverage</text>

  <rect x="82" y="526" width="1036" height="204" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
