  <text x="410" y="558" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">Parse reject</text>
  <text x="595" y="558" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">Schema reject</text>
  <text x="778" y="558" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">Accepted</text>
  <text x="970" y="558" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">Coverage / invalid</text>
  <line x1="100" y1="574" x2="1100" y2="574" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="628" x2="1100" y2="628" stroke="#F1F5F9" stroke-width="2"/>
  <line x1="100" y1="682" x2="1100" y2="682" stroke="#F1F5F9" stroke-width="2"/>
  <text x="112" y="569" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="start">output only</text><text x="410" y="569" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">123</text><text x="595" y="569" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">133</text><text x="778" y="569" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0</text><text x="970" y="569" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0.0 / 1.0</text><text x="112" y="623" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="start">token top k</text><text x="410" y="623" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">123</text><text x="595" y="623" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">133</text><text x="778" y="623" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0</text><text x="970" y="623" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0.0 / 1.0</text><text x="112" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="start">full category evidence</text><text x="410" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">123</text><text x="595" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">133</text><text x="778" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0</text><text x="970" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">0.0 / 1.0</text>
  <text x="600" y="756" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">The parse/schema categories are parallel outcomes, not sequential pipeline stages.</text>
</svg>
