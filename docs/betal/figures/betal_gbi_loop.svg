<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="Flow diagram of the BeTaL-GBI search loop with an admissibility gate"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1180" height="800" fill="#FFFFFF"/><text x="60.0" y="52.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#172033" text-anchor="start">BeTaL-GBI: parameter search with an admissibility gate</text><text x="60.0" y="80.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">BeTaL Algorithm 1 over the GBI BoundaryBench admission boundary. The gate is the addition.</text><rect x="60" y="118" width="320" height="128" rx="14" fill="#F0F9FF" stroke="#BAE0FD" stroke-width="2"/><text x="78.0" y="148.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">1-2  Designer</text><text x="78.0" y="172.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Reads V, rho, and the iteration summary.</text><text x="78.0" y="192.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Returns a JSON configuration proposal.</text><text x="78.0" y="212.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">LLM seam present; NOT_RUN in v0.2.</text><rect x="430" y="118" width="320" height="128" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="448.0" y="148.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">3  Domain projection</text><text x="448.0" y="172.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Clamp, snap to the declared grid, coerce type.</text><text x="448.0" y="192.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Unknown keys dropped and recorded.</text><text x="448.0" y="212.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Every projection note is kept in the run record.</text><rect x="800" y="118" width="320" height="128" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="818.0" y="148.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">4  Simulator</text><text x="818.0" y="172.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Instantiates 256 synthetic legacy-EHR tasks</text><text x="818.0" y="192.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">across eight families, references derived</text><text x="818.0" y="212.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">from an explicit corruption manifest.</text><rect x="800" y="290" width="320" height="128" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="818.0" y="320.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">5  Target surrogate</text><text x="818.0" y="344.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Emits raw text per task.</text><text x="818.0" y="364.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Boundary-floor or repaired-emitter surrogate.</text><text x="818.0" y="384.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">No language model is executed.</text><rect x="430" y="290" width="320" height="128" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/><text x="448.0" y="320.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">v0.1 Programmatic Verification Engine</text><text x="448.0" y="344.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Unmodified. Safe parse, schema, exact, graph,</text><text x="448.0" y="364.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">temporal, version, evidence, quarantine.</text><text x="448.0" y="384.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The BeTaL layer never re-implements a criterion.</text><rect x="430" y="462" width="690" height="112" rx="14" fill="#FEFCE8" stroke="#FDE68A" stroke-width="2"/><text x="448.0" y="492.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">ADMISSIBILITY GATE     rho_hat_adm = admitted / task_count</text><text x="448.0" y="516.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">rho_hat_adm &gt;= 0.05  -&gt;  the observed rate is a difficulty signal; continue the search.</text><text x="448.0" y="536.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">rho_hat_adm &lt;  0.05  -&gt;  the gap is UNDEFINED, not large. Stop, probe the dial, report the floor.</text><rect x="60" y="618" width="500" height="140" rx="14" fill="#F0F9FF" stroke="#BAE0FD" stroke-width="2"/><text x="78.0" y="648.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">6-8  Gap, feedback, selection</text><text x="78.0" y="672.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">g_i = |rho_hat_task - rho|  with rho_hat_task = verified / admitted.</text><text x="78.0" y="692.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Append (v_i, rho_hat_i) to the summary for the next prompt.</text><text x="78.0" y="712.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Keep the configuration with the smallest gap, then evaluate it</text><text x="78.0" y="732.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">on a held-out instantiation under a different split seed.</text><rect x="620" y="618" width="500" height="140" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/><text x="638.0" y="648.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#172033" text-anchor="start">Degenerate outcome (frozen v0.1 shape)</text><text x="638.0" y="672.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">rho_hat_adm = 0.0 at every probed dial value, all three evidence modes.</text><text x="638.0" y="692.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">369 safe_parse_reject / 399 safe_schema_reject across 768 executions.</text><text x="638.0" y="712.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">No point in V raises the rate, so no parameter search is well posed.</text><text x="638.0" y="732.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Correct action: repair the output-format boundary first.</text><line x1="380" y1="182" x2="428" y2="182" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="750" y1="182" x2="798" y2="182" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="960" y1="246" x2="960" y2="288" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="798" y1="354" x2="752" y2="354" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="775" y1="418" x2="775" y2="460" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="576" x2="480" y2="614" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="492.0" y="600.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">gate open</text><line x1="870" y1="576" x2="870" y2="614" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="882.0" y="600.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">gate shut</text><line x1="140" y1="616" x2="140" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="152.0" y="440.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">next iteration</text></svg>
