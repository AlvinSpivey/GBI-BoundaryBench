<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" role="img" aria-label="Scatter of severe-contradiction sensitivity against false-conflict rate for three policies, with the Table 3 target region and the frozen v0.1 baseline"><rect width="1160" height="790" fill="#FFFFFF"/><text x="130.0" y="54.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#172033" text-anchor="start">Table 3 clinical frontier: sensitivity against false conflict</text><text x="130.0" y="82.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Both targets must hold at once. Refusing everything satisfies the first and maximally violates the second.</text><text x="130.0" y="104.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">512 synthetic tasks - 116 injected severe contradictions - 99 conflict-free records - no language model executed</text><rect x="130" y="257.8" width="28.0" height="11.3" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/><line x1="130.0" y1="214" x2="130.0" y2="574" stroke="#E2E8F0" stroke-width="1"/><text x="130.0" y="600.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">0%</text><line x1="270.0" y1="214" x2="270.0" y2="574" stroke="#E2E8F0" stroke-width="1"/><text x="270.0" y="600.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">20%</text><line x1="410.0" y1="214" x2="410.0" y2="574" stroke="#E2E8F0" stroke-width="1"/><text x="410.0" y="600.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor