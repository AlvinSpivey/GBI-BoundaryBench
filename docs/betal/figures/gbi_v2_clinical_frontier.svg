licy</text><rect x="291.1" y="141.1" width="9.9" height="9.9" rx="1.5" fill="#C2410C" stroke="#FFFFFF" stroke-width="2"/><text x="308.0" y="150.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Ablation: 2 gates omitted</text><polygon points="532.0,139.7 537.8,150.1 526.2,150.1" fill="#0D9488" stroke="#FFFFFF" stroke-width="2"/><text x="544.0" y="150.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Ablation: score-based identity</text><polygon points="806.0,138.8 813.1,146.0 806.0,153.2 798.9,146.0" fill="#991B1B" stroke="#FFFFFF" stroke-width="2"/><text x="818.0" y="150.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">v0.1 frozen baseline</text><rect x="130" y="168" width="26" height="14" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/><text x="164.0" y="180.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Table 3 target region: sensitivity 100% and false conflict &lt;= 4%</text><rect x="130" y="660" width="900" height="72" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="150.0" y="690.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172033" text-anchor="start">Scorecard against main.pdf Appendix B</text><text x="150.0" y="714.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Table 3: 5/5 measurable targets met, 1 out of scope (needs a TEE).   Additional manuscript claims: 8/8 met.   Appendix B.1 Assertions 1-3: all passed.</text><text x="130.0" y="770.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">Ablation curves are deliberately deficient policies. That they fail is what makes the complete policy&#x27;s result informative.</text></svg>
