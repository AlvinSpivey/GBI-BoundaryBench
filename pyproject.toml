[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbi-boundarybench-public-showcase"
version = "0.1.0"
description = "Public showcase for GBI BoundaryBench v0.1 programmatic verification architecture"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "boundarybench",
    "boundarybench.tasks*",
    "boundarybench.verification*",
    "boundarybench.adapters*",
    "boundarybench.empirical*",
    "boundarybench.stage1*",
]
