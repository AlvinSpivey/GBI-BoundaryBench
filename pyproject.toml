[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbi-boundarybench-public-showcase"
version = "0.2.0"
description = "Public showcase for the GBI BoundaryBench / GBI-DCSE research program"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
betal = ["numpy>=1.26"]
dcse = ["numpy>=1.26", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "boundarybench",
    "boundarybench.tasks*",
    "boundarybench.verification*",
    "boundarybench.adapters*",
    "boundarybench.empirical*",
    "boundarybench.stage1*",
    "boundarybench.dcse*",
    "boundarybench.gbi*",
    "boundarybench.betal*",
]
